{% extends "base.html" %}
{% block content %}

<div class="card p-3">

  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-0">New Device Entry</h4>
      <small>GHATSILA COLLEGE ROAD</small>
    </div>

    <div class="d-flex gap-2">
      <input id="searchBox"
             class="form-control form-control-sm"
             placeholder="🔍 Search...">

      <a href="/overdue"
         class="btn btn-warning btn-sm">
        Overdue List
      </a>

      <button id="refreshBtn"
              class="btn btn-outline-secondary btn-sm">
        Refresh
      </button>
    </div>
  </div>

  <hr>

  <div class="row g-2">

    <div class="col-md-3">
      <label class="form-label">Type</label>
      <select id="type" class="form-select">
        <option>Laptop</option>
        <option>Printer</option>
        <option>Other</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Customer</label>
      <input id="customer" class="form-control">
    </div>

    <div class="col-md-3">
      <label class="form-label">Phone</label>
      <input id="phone" class="form-control">
    </div>

    <div class="col-md-3">
      <label class="form-label">Model / Serial</label>
      <input id="model" class="form-control">
    </div>

    <!-- PRIORITY -->
    <div class="col-md-3">
      <label class="form-label">Priority</label>

      <select id="priority" class="form-select">

        <option value="Regular">
          🟢 Regular
        </option>

        <option value="Rework">
          🔵 Rework
        </option>

        <option value="Urgent">
          🔴 Urgent
        </option>

      </select>
    </div>

    <div class="col-12">
      <label class="form-label">Problem</label>

      <textarea id="problem"
                class="form-control"
                rows="2"></textarea>
    </div>

    <div class="col-md-4">
      <label class="form-label">Receive Date</label>

      <input id="receive_date"
             type="datetime-local"
             class="form-control">
    </div>

    <div class="col-md-2 d-flex align-items-end">

      <button id="saveBtn"
              class="btn btn-primary w-100">
        Save
      </button>

    </div>

  </div>

</div>


<!-- DEVICE LIST -->

<div class="card p-3 mt-3">

  <h5>Device List</h5>

  <div class="table-responsive">

    <table class="table table-sm align-middle"
           id="tbl">

      <thead class="table-primary">

        <tr>
          <th>#</th>
          <th>Type</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Model</th>
          <th>Priority</th>
          <th>Problem</th>
          <th>Receive</th>
          <th>Out</th>
          <th>In</th>
          <th>Return</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody></tbody>

    </table>

  </div>

</div>


<!-- ================================================= -->
<!-- OUT / IN DATE TIME MODAL -->
<!-- ================================================= -->

<div id="actionDateModal"
     style="
       display:none;
       position:fixed;
       inset:0;
       background:rgba(0,0,0,.6);
       z-index:10000;
       padding:20px;
     ">

  <div style="
       background:#fff;
       max-width:420px;
       margin:25% auto;
       padding:20px;
       border-radius:10px;
       box-shadow:0 5px 25px rgba(0,0,0,.3);
     ">

    <h5 id="actionDateTitle">
      Select Date & Time
    </h5>

    <p class="text-muted mb-2">
      कृपया सही Date और Time चुनें।
    </p>

    <input id="actionDateInput"
           type="datetime-local"
           class="form-control">

    <div class="text-end mt-3">

      <button class="btn btn-secondary btn-sm"
              onclick="closeActionDate()">
        Cancel
      </button>

      <button class="btn btn-primary btn-sm"
              onclick="saveActionDate()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- ================================================= -->
<!-- BILL MODAL -->
<!-- ================================================= -->

<div id="billModal"
     style="
       display:none;
       position:fixed;
       inset:0;
       background:rgba(0,0,0,.6);
       z-index:9999;
     ">

  <div style="
       background:#fff;
       max-width:500px;
       margin:12% auto;
       padding:15px;
       border-radius:6px;
     ">

    <h5>Billing Details</h5>

    <label class="form-label">
      Parts
    </label>

    <input id="parts"
           class="form-control">

    <div class="row g-2 mt-2">

      <div class="col">

        <label class="form-label">
          Parts Amount
        </label>

        <input id="parts_total"
               type="number"
               class="form-control">

      </div>

      <div class="col">

        <label class="form-label">
          Service Charge
        </label>

        <input id="service_charge"
               type="number"
               class="form-control">

      </div>

      <div class="col">

        <label class="form-label">
          Other
        </label>

        <input id="other"
               type="number"
               class="form-control">

      </div>

    </div>

    <label class="form-label mt-2">
      Payment Mode
    </label>

    <select id="payment_mode"
            class="form-select">

      <option>Cash</option>
      <option>UPI</option>
      <option>Card</option>

    </select>

    <div class="text-end mt-3">

      <button class="btn btn-secondary btn-sm"
              onclick="closeBill()">
        Cancel
      </button>

      <button class="btn btn-primary btn-sm"
              onclick="saveBill()">
        Save
      </button>

    </div>

  </div>

</div>


<style>

.overdue{
  background:#fee2e2!important;
}

.badge-pill{
  display:inline-block;
  border-radius:999px;
  padding:.25rem .7rem;
  font-weight:700;
  color:#111;
}


/* STATUS */

.b-received{
  background:#e5e7eb;
  color:#374151;
}

.b-ready{
  background:#86efac;
  color:#166534;
}

.b-delivered{
  background:#a5b4fc;
  color:#3730a3;
}

.b-in{
  background:#fde68a;
  color:#92400e;
}

.b-out{
  background:#93c5fd;
  color:#1e3a8a;
}

.b-reject{
  background:#fca5a5;
  color:#991b1b;
}


/* PRIORITY */

.p-regular{
  background:#bbf7d0;
  color:#166534;
}

.p-rework{
  background:#bfdbfe;
  color:#1e40af;
}

.p-urgent{
  background:#fecaca;
  color:#991b1b;
}

</style>


{% raw %}
<script>


/* ================================================= */
/* STATUS BADGE */
/* ================================================= */

function fmtBadge(s){

  return s==='Received'
    ? 'badge-pill b-received'
    :
    s==='Ready'
    ? 'badge-pill b-ready'
    :
    s==='Delivered'
    ? 'badge-pill b-delivered'
    :
    s==='Rejected'
    ? 'badge-pill b-reject'
    :
    s==='In'
    ? 'badge-pill b-in'
    :
    s==='Out'
    ? 'badge-pill b-out'
    :
    'badge-pill b-received';

}


/* ================================================= */
/* PRIORITY BADGE */
/* ================================================= */

function fmtPriority(p){

  return p==='Urgent'
    ? 'badge-pill p-urgent'
    :
    p==='Rework'
    ? 'badge-pill p-rework'
    :
    'badge-pill p-regular';

}


/* ================================================= */
/* API */
/* ================================================= */

async function api(p,opt={}){

  const r = await fetch(p,opt);

  if(!r.ok)
    throw new Error(await r.text());

  return await r.json();

}


/* ================================================= */
/* INDIA TIME */
/* ================================================= */

function nowLocal(){

  const d = new Date();

  const offset =
    d.getTimezoneOffset();

  const local =
    new Date(
      d.getTime() -
      offset * 60000
    );

  return local
    .toISOString()
    .slice(0,16);

}


/* ================================================= */
/* SAVE ENTRY */
/* ================================================= */

document.getElementById(
  'saveBtn'
).onclick = async()=>{

  const d={

    type: type.value,

    customer: customer.value,

    phone: phone.value,

    model: model.value,

    problem: problem.value,

    priority: priority.value,

    receive_date: receive_date.value

  };


  const r = await fetch(
    '/api/entries',
    {
      method:'POST',

      headers:{
        'Content-Type':
        'application/json'
      },

      body:JSON.stringify(d)

    }
  );


  if(!r.ok){

    alert(
      'Entry save nahi hui'
    );

    return;

  }


  /* FORM CLEAR */

  document.getElementById(
    'customer'
  ).value='';

  document.getElementById(
    'phone'
  ).value='';

  document.getElementById(
    'model'
  ).value='';

  document.getElementById(
    'problem'
  ).value='';


  /* PRIORITY RESET */

  document.getElementById(
    'priority'
  ).value='Regular';


  /* TYPE RESET */

  document.getElementById(
    'type'
  ).value='Laptop';


  /* DATE RESET */

  document.getElementById(
    'receive_date'
  ).value=nowLocal();


  load();

};


/* ================================================= */
/* GLOBAL */
/* ================================================= */

let ALL_ROWS=[];

let billForId=null;


/* Manual OUT / IN variables */

let actionForId=null;

let actionForType=null;


/* ================================================= */
/* LOAD */
/* ================================================= */

async function load(){

  const rs =
    await api('/api/entries');

  ALL_ROWS=rs;

  render(rs);

}


/* ================================================= */
/* RENDER */
/* ================================================= */

function render(rows){

  const tb =
    document.querySelector(
      '#tbl tbody'
    );

  tb.innerHTML='';


  rows.forEach((r,i)=>{

    let od='';


    /*
       OVERDUE RULE

       Urgent = 24 HOURS
       Regular = 10 DAYS
       Rework = 10 DAYS
    */

    if(
      r.status!=='Delivered' &&
      r.receive_date
    ){

      const receiveTime =
        new Date(
          r.receive_date
        ).getTime();

      const nowTime =
        new Date().getTime();

      const diffDays =
        (nowTime-receiveTime) /
        (1000*60*60*24);


      let limit=10;


      if(r.priority==='Urgent'){
        limit=1;
      }


      if(diffDays>=limit){
        od='overdue';
      }

    }


    const tr =
      document.createElement('tr');

    tr.className=od;


    tr.innerHTML=`

<td>${i+1}</td>

<td>${r.type||''}</td>

<td>${r.customer||''}</td>

<td>${r.phone||''}</td>

<td>${r.model||''}</td>


<td>

  <span class="${fmtPriority(
    r.priority||'Regular'
  )}">

    ${r.priority||'Regular'}

  </span>

</td>


<td>${r.problem||''}</td>

<td>${r.receive_date||''}</td>

<td>${r.out_date||''}</td>

<td>${r.in_date||''}</td>

<td>${r.return_date||''}</td>


<td>

  <span class="${fmtBadge(
    r.status||''
  )}">

    ${r.status||''}

  </span>

</td>


<td class="text-nowrap">


  <!-- OUT -->

  <button
    class="btn btn-sm btn-outline-secondary"
    onclick="manualAction(
      ${r.id},
      'out'
    )">

    Out

  </button>


  <!-- IN -->

  <button
    class="btn btn-sm btn-outline-secondary"
    onclick="manualAction(
      ${r.id},
      'in'
    )">

    In

  </button>


  <!-- READY -->

  <button
    class="btn btn-sm btn-outline-secondary"
    onclick="act(
      ${r.id},
      'ready'
    )">

    Ready

  </button>


  <!-- DELIVERED -->

  <button
    class="btn btn-sm btn-outline-secondary"
    onclick="confirmAct(
      ${r.id},
      'delivered'
    )">

    Delivered

  </button>


  <!-- REJECT -->

  <button
    class="btn btn-sm btn-outline-danger"
    onclick="act(
      ${r.id},
      'reject'
    )">

    Reject

  </button>


  <!-- BILL -->

  <button
    class="btn btn-sm btn-outline-primary"
    onclick="openBill(
      ${r.id}
    )">

    Bill

  </button>


  <!-- PRINT -->

  <button
    class="btn btn-sm btn-outline-primary"
    onclick="window.open(
      '/print/${r.id}',
      '_blank'
    )">

    Print

  </button>


  ${
    r.status === 'Delivered'
    && r.whatsapp
    ?
    `
    <a
      href="${r.whatsapp}"
      target="_blank"
      class="btn btn-sm btn-success">

      📲 WhatsApp

    </a>
    `
    :
    ''
  }


  <!-- DELETE -->

  <button
    class="btn btn-sm btn-outline-dark"
    onclick="delE(
      ${r.id}
    )">

    Delete

  </button>


</td>

`;


    tb.appendChild(tr);

  });

}


/* ================================================= */
/* SEARCH */
/* ================================================= */

document.getElementById(
  'searchBox'
)
.addEventListener(
  'input',
  e=>{

    const t =
      e.target.value
      .toLowerCase();


    render(

      ALL_ROWS.filter(r=>

        Object.values(r)
        .some(v=>

          String(v||'')
          .toLowerCase()
          .includes(t)

        )

      )

    );

  }
);


/* ================================================= */
/* REFRESH */
/* ================================================= */

document.getElementById(
  'refreshBtn'
).onclick=load;


/* ================================================= */
/* CONFIRM */
/* ================================================= */

function confirmAct(
  id,
  action
){

  const label =
    action==='out'
    ? 'OUT'
    :
    action==='in'
    ? 'IN'
    :
    'DELIVERED';


  if(
    confirm(
      `Mark as ${label}?`
    )
  ){

    act(
      id,
      action
    );

  }

}


/* ================================================= */
/* MANUAL OUT / IN */
/* ================================================= */

function manualAction(
  id,
  action
){

  actionForId=id;

  actionForType=action;


  const title =
    action==='out'
    ? 'OUT Date & Time'
    : 'IN Date & Time';


  document.getElementById(
    'actionDateTitle'
  ).innerText=title;


  /*
     Current date/time default
  */

  document.getElementById(
    'actionDateInput'
  ).value=nowLocal();


  document.getElementById(
    'actionDateModal'
  ).style.display='block';

}


/* ================================================= */
/* CLOSE DATE MODAL */
/* ================================================= */

function closeActionDate(){

  document.getElementById(
    'actionDateModal'
  ).style.display='none';

  actionForId=null;

  actionForType=null;

}


/* ================================================= */
/* SAVE MANUAL OUT / IN */
/* ================================================= */

async function saveActionDate(){

  if(
    !actionForId ||
    !actionForType
  ){

    closeActionDate();

    return;

  }


  const selectedDate =
    document.getElementById(
      'actionDateInput'
    ).value;


  if(!selectedDate){

    alert(
      'Date & Time select kijiye'
    );

    return;

  }


  try{

    const response =
      await fetch(
        `/api/entries/${actionForId}/action`,
        {

          method:'POST',

          headers:{
            'Content-Type':
            'application/json'
          },

          body:JSON.stringify({

            action:
              actionForType,

            date:
              selectedDate

          })

        }
      );


    if(!response.ok){

      const text =
        await response.text();

      alert(
        'Date/Time save nahi hua\n' +
        text
      );

      return;

    }


    closeActionDate();

    load();

  }
  catch(error){

    console.error(error);

    alert(
      'Server error'
    );

  }

}


/* ================================================= */
/* NORMAL ACTION */
/* ================================================= */

async function act(
  id,
  action
){

  await fetch(
    `/api/entries/${id}/action`,
    {

      method:'POST',

      headers:{
        'Content-Type':
        'application/json'
      },

      body:JSON.stringify({
        action
      })

    }
  );


  load();

}


/* ================================================= */
/* DELETE */
/* ================================================= */

async function delE(id){

  if(
    confirm(
      'Delete this record?'
    )
  ){

    await fetch(
      `/api/entries/${id}`,
      {
        method:'DELETE'
      }
    );

    load();

  }

}


/* ================================================= */
/* BILL */
/* ================================================= */

function openBill(id){

  billForId=id;

  document.getElementById(
    'billModal'
  ).style.display='block';

}


function closeBill(){

  document.getElementById(
    'billModal'
  ).style.display='none';

}


async function saveBill(){

  const d={

    parts:
      parts.value,

    parts_total:
      parts_total.value,

    service_charge:
      service_charge.value,

    other:
      other.value,

    payment_mode:
      payment_mode.value

  };


  await fetch(
    `/api/entries/${billForId}/bill`,
    {

      method:'POST',

      headers:{
        'Content-Type':
        'application/json'
      },

      body:JSON.stringify(d)

    }
  );


  closeBill();

  load();

}


/* ================================================= */
/* INITIAL LOAD */
/* ================================================= */

document.getElementById(
  'receive_date'
).value=nowLocal();


load();

</script>
{% endraw %}

{% endblock %}
